# Homalos数据中心配置文件
# 配置文件格式参考：https://yaml.org/spec/1.2/spec.html

# 数据中心基础配置
base:
  name: "Homalos数据中心"                   # 数据中心名称
  description: "7x24小时运行的行情数据中心"    # 数据中心描述
  enable: true                             # 是否启用

  # 闹钟调度器时间配置，支持多种交易时段和自定义时间设置
  alarm_schedule:
    # 登录时间点
    login_times:
      - "08:45"  # 早盘登录
      - "20:45"  # 夜盘登录
    # 开盘前检测时间点
    before_open_times:
      - "08:50"  # 早盘开盘前
      - "20:50"  # 夜盘开盘前
    # 收盘后处理时间点
    after_close_times:
      - "15:30"  # 早盘收盘后处理
      - "23:30"  # 夜盘收盘后处理
    # 检查间隔（秒）
    check_interval: 60

  # 交易时间配置
  trading_hours:
    enable_check: false         # 启用交易时段检查
    futures:                    # 期货交易时段配置，格式为[["开始时间", "结束时间"], ...]
      - ["09:00", "10:15"]      # 早盘
      - ["10:30", "11:30"]      # 早盘
      - ["13:30", "15:00"]      # 午盘
      - ["21:00", "23:00"]      # 夜盘(大部分品种)
      - ["21:00", "02:30"]      # 夜盘(某些品种)

  # CSV配置
  csv:
    base_path: "data"           # 数据存储基础路径
    cache_size: 100             # CSV缓存大小

  # 数据库配置
  database:
    type: "sqlite"
    tick:
      path: "data/tick_db"      # 数据存储路径
      wal_mode: true            # 启用WAL模式，提高并发写入性能
      cache_size: 1024          # 缓存大小，单位KB
      timeout: 30               # 超时时间，单位秒
    bar:
      path: "data/bar_db"       # 数据存储路径
      wal_mode: true            # 启用WAL模式，提高并发写入性能
      cache_size: 1024          # 缓存大小，单位KB
      timeout: 30               # 超时时间，单位秒

  # K线合成配置
  bar_generation:
    intervals: ["1m", "5m", "15m", "30m", "1h", "1d"]   # 生成K线的时间间隔
