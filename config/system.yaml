base:
  name: Homalos 量化交易系统
  describe: Homalos 是一个专业的期货量化交易系统，提供策略开发、回测、实盘交易等功能，助力投资者实现量化交易目标。
  version: 0.0.1
  author: Homalos Team
  copyright: Copyright © 2025 Homalos Team. All rights reserved.
  contact: https://github.com/homalos
  user_guide: https://homalos.github.io/guide/quick_start
  technology_stack:
  - 后端：Python 3.13 + FastAPI
  - 前端：Vue 3 + Element Plus + Vite
  - 数据库：SQLite
  timezone: Asia/Shanghai
  dev_mode: true
  
  # 策略同步配置
  strategy_sync:
    # 默认管理员ID（启动时同步策略时使用）
    default_admin_id: 1
    # 是否启用自动同步
    auto_sync: true
