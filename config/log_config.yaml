# 日志配置
logging:
  level: "INFO"
  console:
    enabled: true
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  file:
    enabled: true
    path: "log/homalos_{time:YYYY-MM-DD}.log"
    rotation: "100 MB"  # 当文件超过 100MB 时进行轮转
    retention: "30 days"  # 保留日志的天数
    compression: "zip"

