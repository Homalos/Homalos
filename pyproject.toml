description = "基于Python的期货量化交易系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "bypy>=1.8.9",
    "chinese-days>=0.0.1",
    "configparser>=7.2.0",
    "fastapi>=0.118.0",
    "loguru>=0.7.3",
    "msgpack>=1.1.2",
    "pandas>=2.3.2",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=7.1.0",
    "pydantic[email]>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "ruamel-yaml>=0.18.15",
    "sqlalchemy>=2.0.43",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.37.0",
    "watchdog>=6.0.0",
    "watchfiles>=1.1.0",
    "websocket-client>=1.9.0",
]
