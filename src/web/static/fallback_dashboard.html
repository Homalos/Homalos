<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="仪表板加载失败 - Homalos量化交易系统">
    <meta name="keywords" content="Homalos, 量化交易系统, 仪表板">

    <meta name="robots" content="index, follow">
    <title>仪表板加载失败 - Homalos量化交易系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }
        .error-icon {
            font-size: 64px;
            color: #a29bfe;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .error-message {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #409EFF;
            color: white;
        }
        .btn-primary:hover {
            background: #337ecc;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }
        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">📊</div>
        <h1 class="error-title">仪表板加载失败</h1>
        <p class="error-message">
            无法加载仪表板页面，请检查静态文件是否存在。<br>
            或者稍后重试访问。
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">返回主页</a>
            <button onclick="location.reload()" class="btn btn-secondary">重新加载</button>
        </div>
    </div>
</body>
