<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易图表测试页面</title>
    <!-- Element Plus样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="static/css/app.css">
    <link rel="stylesheet" href="static/css/components/trading-chart.css">
    <style>
        body {
            padding: 20px;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .debug-info {
            background: #f0f0f0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>交易图表组件测试</h1>
        
        <div class="debug-info">
            <h3>调试信息:</h3>
            <div id="debug-output"></div>
        </div>
        
        <div id="app">
            <!-- Vue应用挂载点 -->
        </div>
    </div>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <!-- ECharts -->
    <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
    
    <!-- 应用脚本 -->
    <script src="static/js/i18n/index.js"></script>
    <script src="static/js/store/state.js"></script>
    <script src="static/js/services/api.js"></script>
    <script src="static/js/services/websocket.js"></script>
    <script src="static/js/components/TradingChart.js"></script>
    
    <script>
        // 调试函数
        function addDebugInfo(message) {
            const debugOutput = document.getElementById('debug-output');
            debugOutput.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        // 检查依赖
        addDebugInfo('检查Vue: ' + (typeof Vue !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        addDebugInfo('检查ElementPlus: ' + (typeof ElementPlus !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        addDebugInfo('检查ECharts: ' + (typeof echarts !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        addDebugInfo('检查TradingChartComponent: ' + (typeof window.TradingChartComponent !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        addDebugInfo('检查useGlobalState: ' + (typeof window.useGlobalState !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        addDebugInfo('检查useI18n: ' + (typeof window.useI18n !== 'undefined' ? '✅ 已加载' : '❌ 未加载'));
        
        // 等待所有依赖加载完成
        setTimeout(() => {
            try {
                if (typeof Vue === 'undefined' || typeof ElementPlus === 'undefined' || typeof window.TradingChartComponent === 'undefined') {
                    addDebugInfo('❌ 依赖未完全加载，无法创建应用');
                    return;
                }
                
                addDebugInfo('开始创建Vue应用...');
                
                // 创建简单的测试应用
                const TestApp = {
                    template: `
                        <div>
                            <h2>交易图表组件测试</h2>
                            <trading-chart-component v-if="showChart"></trading-chart-component>
                            <div v-else>
                                <p>正在加载交易图表组件...</p>
                                <el-button @click="showChart = true">显示图表</el-button>
                            </div>
                        </div>
                    `,
                    setup() {
                        const showChart = Vue.ref(true);
                        return { showChart };
                    }
                };
                
                const app = Vue.createApp(TestApp);
                app.use(ElementPlus);
                
                // 注册交易图表组件
                app.component('trading-chart-component', window.TradingChartComponent);
                addDebugInfo('✅ TradingChartComponent已注册');
                
                app.mount('#app');
                addDebugInfo('✅ Vue应用已挂载');
                
            } catch (error) {
                addDebugInfo('❌ 创建应用失败: ' + error.message);
                console.error('创建应用失败:', error);
            }
        }, 1000);
    </script>
</body>
</html>
